name: Cancel Temporal Experiments Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cancel-temporal-experiments-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel obsolete temporal experiment and audit runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for RUN_ID in 31982381770 31983142349 31988260476; do
            echo "Cancelling $RUN_ID"
            curl --fail-with-body -L \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/cancel" \
              || true
          done
