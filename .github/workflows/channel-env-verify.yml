name: Channel Environment Verification

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/channel-env-verify.yml'

jobs:
  verify-environment:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15

    steps:
      - name: Show runner identity
        run: |
          echo "Hostname: $(hostname)"
          echo "User: $(whoami)"
          echo "Home: $HOME"
          echo "Working directory: $(pwd)"

      - name: Check NVIDIA GPU
        run: |
          nvidia-smi

      - name: Verify Sionna virtual environment
        run: |
          test -x "$HOME/sionna-env/bin/python"
          "$HOME/sionna-env/bin/python" --version
          "$HOME/sionna-env/bin/python" - <<'PY'
          import numpy
          import zmq
          import torch
          import sionna
          import sionna.rt

          print("numpy:", numpy.__version__)
          print("pyzmq:", zmq.__version__)
          print("torch:", torch.__version__)
          print("sionna:", getattr(sionna, "__version__", "unknown"))
          print("sionna.rt import: OK")
          print("torch.cuda.is_available():", torch.cuda.is_available())
          if not torch.cuda.is_available():
              raise SystemExit("PyTorch cannot access CUDA")
          print("CUDA device count:", torch.cuda.device_count())
          print("CUDA device 0:", torch.cuda.get_device_name(0))
          PY

      - name: Check Kubernetes tooling
        run: |
          command -v kubectl
          kubectl version --client

      - name: Check Kubernetes cluster state
        continue-on-error: true
        run: |
          echo "--- node ---"
          kubectl get nodes -o wide
          echo "--- storage classes ---"
          kubectl get storageclass
          echo "--- required storage class: longhorn ---"
          kubectl get storageclass longhorn
          echo "--- open5gs pods ---"
          kubectl get pods -n open5gs -o wide

      - name: Check Open5GS pods even if storage check failed
        if: always()
        continue-on-error: true
        run: |
          kubectl get pods -n open5gs -o wide

      - name: Check out repository
        if: always()
        uses: actions/checkout@v4

      - name: Verify project files
        if: always()
        run: |
          test -d srsran_open5gs
          test -f srsran_open5gs/bin/evaluation-experiment.py
          test -f srsran_open5gs/experiments/studies/neural-base.json
          echo "Project files found."
          git status --short --branch
