name: Current-TB Pair Weighting Ablation

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/current-tb-pair-ablation.yml'
  workflow_dispatch:

jobs:
  current-tb-pair-ablation:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Prepare experiment code and checkpoint
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$HOME/sionna-srsran"
          NRX="$ROOT/neural_rx"
          STUDY="$ROOT/temporal_reuse"
          PY="$HOME/miniforge3/envs/neural_rx/bin/python"
          OUT="$STUDY/current_tb_pair/run_${GITHUB_RUN_ID}"
          mkdir -p "$OUT"

          git -C "$NRX" fetch origin experiment/current-tb-pair-weighting
          git -C "$NRX" show origin/experiment/current-tb-pair-weighting:scripts/current_tb_edge_ablation.py > "$STUDY/current_tb_edge_ablation.py"
          "$PY" -m py_compile "$STUDY/current_tb_edge_ablation.py"

          CKPT="$STUDY/edge_memory/run_31523159794/dedge_1_k2.weights.h5"
          if [ ! -f "$CKPT" ]; then
            TMP="$OUT/old_edge_artifact"
            mkdir -p "$TMP"
            gh run download 31523159794 \
              --repo BestCody/Channel-Emulation-Integration-With-SRSran \
              --name temporal-edge-memory-31523159794 \
              --dir "$TMP"
            CKPT="$(find "$TMP" -type f -name 'dedge_1_k2.weights.h5' | head -n 1)"
          fi
          test -n "$CKPT"
          test -f "$CKPT"
          echo "Using checkpoint: $CKPT"

          echo "OUT=$OUT" >> "$GITHUB_ENV"
          echo "PY=$PY" >> "$GITHUB_ENV"
          echo "NRX=$NRX" >> "$GITHUB_ENV"
          echo "STUDY=$STUDY" >> "$GITHUB_ENV"
          echo "CKPT=$CKPT" >> "$GITHUB_ENV"
          nvidia-smi

      - name: Evaluate dynamic and recurrent modes on both A40s
        shell: bash
        run: |
          set -euo pipefail
          run_mode() {
            local mode="$1"
            local gpu="$2"
            mkdir -p "$OUT/$mode"
            (
              cd "$NRX/scripts"
              "$PY" "$STUDY/current_tb_edge_ablation.py" \
                --mode "$mode" \
                --gpu "$gpu" \
                --checkpoint "$CKPT" \
                --num-it 2 \
                --eval-batch 16 \
                --eval-target-errors 120 \
                --eval-max-batches 24 \
                --seed 20261811 \
                --output-dir "$OUT/$mode"
            ) 2>&1 | tee "$OUT/${mode}.log"
          }

          run_mode dynamic 0 &
          P0=$!
          run_mode recurrent 1 &
          P1=$!
          wait "$P0"
          wait "$P1"

      - name: Summarize verdict inputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          "$PY" - <<'PY' | tee "$OUT/summary.log"
          import json, pathlib
          out = pathlib.Path("${{ env.OUT }}")
          rows = {}
          for mode in ("dynamic", "recurrent"):
              p = out / mode / f"{mode}_k2.json"
              if p.exists():
                  d = json.loads(p.read_text())
                  rows[mode] = {
                      "snr_at_10pct_tbler_db": d.get("snr_at_10pct_tbler_db"),
                      "median_latency_ms": d.get("latency", {}).get("median_ms"),
                      "p90_latency_ms": d.get("latency", {}).get("p90_ms"),
                      "tbler_vs_ebno": d.get("tbler_vs_ebno"),
                  }
          baseline = {"cold_k2_db": 2.87957, "cold_k8_db": 2.3365}
          summary = {"baseline": baseline, "results": rows}
          if "dynamic" in rows and "recurrent" in rows:
              a = rows["dynamic"]["snr_at_10pct_tbler_db"]
              b = rows["recurrent"]["snr_at_10pct_tbler_db"]
              if a is not None and b is not None:
                  summary["recurrent_minus_dynamic_db"] = b - a
          (out / "summary.json").write_text(json.dumps(summary, indent=2))
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-tb-pair-ablation-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: warn
          retention-days: 30
