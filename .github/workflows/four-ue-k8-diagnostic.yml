name: Four UE K8 Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/four-ue-k8-diagnostic.yml'

jobs:
  four-ue-k8-diagnostic:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 120
    steps:
      - name: Prepare diagnostic
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$HOME/sionna-srsran"
          NRX="$ROOT/neural_rx"
          STUDY="$ROOT/temporal_reuse"
          PY="$HOME/miniforge3/envs/neural_rx/bin/python"
          SOURCE="$STUDY/four_ue_pair/decisive_31549715846"
          WEIGHTS="$SOURCE/cold/cold_40000_weights.pkl"
          OUT="$STUDY/four_ue_pair/k8_diag_${GITHUB_RUN_ID}"
          mkdir -p "$OUT"
          test -f "$WEIGHTS"
          git -C "$NRX" fetch origin experiment/4ue-pair-weighting
          git -C "$NRX" show origin/experiment/4ue-pair-weighting:scripts/eval_four_ue_cold_k8.py > "$STUDY/eval_four_ue_cold_k8.py"
          git -C "$NRX" show origin/experiment/4ue-pair-weighting:config/nrx_large_4ue.cfg > "$NRX/config/nrx_large_4ue.cfg"
          "$PY" -m py_compile "$STUDY/eval_four_ue_cold_k8.py"
          echo "PY=$PY" >> "$GITHUB_ENV"
          echo "NRX=$NRX" >> "$GITHUB_ENV"
          echo "STUDY=$STUDY" >> "$GITHUB_ENV"
          echo "WEIGHTS=$WEIGHTS" >> "$GITHUB_ENV"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          nvidia-smi

      - name: Evaluate cold K8
        shell: bash
        run: |
          set -euo pipefail
          cd "$NRX/scripts"
          "$PY" "$STUDY/eval_four_ue_cold_k8.py" \
            --gpu 0 --weights "$WEIGHTS" --output "$OUT/k8_result.json" --seed 20260811 \
            2>&1 | tee "$OUT/k8.log"

      - name: Summarize diagnosis
        shell: bash
        run: |
          set -euo pipefail
          "$PY" - <<'PY' | tee "$OUT/summary.log"
          import json, os, pathlib
          out=pathlib.Path(os.environ['OUT'])
          r=json.load(open(out/'k8_result.json'))
          c10=r['snr_at_10pct_tbler_db']
          verdict='k8_works_deeper_inference_needed' if c10 is not None else 'k8_also_fails_setup_or_training_problem'
          s={'run_id':os.environ.get('GITHUB_RUN_ID'),'cold_k8_crossing_db':c10,
             'best_tbler':r['best_tbler'],'best_ebno_db':r['best_ebno_db'],
             'diagnostic_verdict':verdict}
          (out/'summary.json').write_text(json.dumps(s,indent=2))
          print(json.dumps(s,indent=2))
          PY

      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: four-ue-k8-diagnostic-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: warn
          retention-days: 30
