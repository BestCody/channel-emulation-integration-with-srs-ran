name: Four UE Pair Weighting Experiment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/four-ue-pair-weighting.yml'
  workflow_dispatch:

jobs:
  four-ue-pair-weighting:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 240
    steps:
      - name: Prepare 4-UE experiment
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$HOME/sionna-srsran"
          NRX="$ROOT/neural_rx"
          STUDY="$ROOT/temporal_reuse"
          PY="$HOME/miniforge3/envs/neural_rx/bin/python"
          OUT="$STUDY/four_ue_pair/run_${GITHUB_RUN_ID}"
          mkdir -p "$OUT"
          git -C "$NRX" fetch origin experiment/4ue-pair-weighting
          git -C "$NRX" show origin/experiment/4ue-pair-weighting:scripts/four_ue_pair_weighting_experiment.py > "$STUDY/four_ue_pair_weighting_experiment.py"
          git -C "$NRX" show origin/experiment/4ue-pair-weighting:config/nrx_large_4ue.cfg > "$NRX/config/nrx_large_4ue.cfg"
          "$PY" -m py_compile "$STUDY/four_ue_pair_weighting_experiment.py"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          echo "PY=$PY" >> "$GITHUB_ENV"
          echo "NRX=$NRX" >> "$GITHUB_ENV"
          echo "STUDY=$STUDY" >> "$GITHUB_ENV"
          nvidia-smi

      - name: Four-UE forward-pass smoke test
        shell: bash
        run: |
          set -euo pipefail
          cd "$NRX/scripts"
          "$PY" - <<'PY'
          import sys
          sys.path.insert(0, '..')
          from utils import Parameters, E2E_Model, load_weights
          p = Parameters('nrx_large_4ue.cfg', training=False, system='nrx')
          m = E2E_Model(p, training=False, mcs_arr_eval_idx=0)
          b, bh = m(1, 4.0, num_tx=4)
          load_weights(m, '../weights/nrx_large_weights')
          b, bh = m(1, 4.0, num_tx=4)
          print('4UE_SMOKE_OK', b.shape, bh.shape)
          PY

      - name: Train and evaluate K1 and K2 on both A40s
        shell: bash
        run: |
          set -euo pipefail
          run_k() {
            local k="$1"
            local gpu="$2"
            mkdir -p "$OUT/k${k}"
            (
              cd "$NRX/scripts"
              "$PY" "$STUDY/four_ue_pair_weighting_experiment.py" \
                --k "$k" \
                --gpu "$gpu" \
                --train-steps 1200 \
                --batch 8 \
                --eval-batch 4 \
                --eval-target-errors 80 \
                --eval-max-batches 20 \
                --seed 20260811 \
                --output-dir "$OUT/k${k}"
            ) 2>&1 | tee "$OUT/k${k}.log"
          }
          run_k 1 0 & P0=$!
          run_k 2 1 & P1=$!
          wait "$P0"
          wait "$P1"

      - name: Summarize 4-UE results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          "$PY" - <<'PY' | tee "$OUT/summary.log"
          import json, pathlib
          out = pathlib.Path("${{ env.OUT }}")
          summary = {"num_tx": 4, "channel": "UMi", "results": {}}
          for k in (1,2):
              p = out / f"k{k}" / f"four_ue_pair_k{k}.json"
              if p.exists():
                  d = json.loads(p.read_text())
                  summary["results"][f"k{k}"] = {
                      "cold_crossing_db": d["cold"]["eval"]["snr_at_10pct_tbler_db"],
                      "weighted_crossing_db": d["weighted"]["eval"]["snr_at_10pct_tbler_db"],
                      "weighted_gain_db": d.get("weighted_gain_db"),
                      "pair_parameters": d["weighted"]["train"]["pair_parameters"],
                      "pair_weight_diagnostic": d["weighted"]["eval"].get("pair_weight_diagnostic"),
                  }
          k1 = summary["results"].get("k1", {})
          k2 = summary["results"].get("k2", {})
          if k1 and k2:
              w1 = k1.get("weighted_crossing_db")
              c2 = k2.get("cold_crossing_db")
              summary["weighted_k1_minus_cold_k2_db"] = None if w1 is None or c2 is None else w1-c2
          (out / "summary.json").write_text(json.dumps(summary, indent=2))
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload 4-UE results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: four-ue-pair-weighting-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: warn
          retention-days: 30
