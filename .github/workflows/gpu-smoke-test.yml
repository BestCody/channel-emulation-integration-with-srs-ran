name: GPU Smoke Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/gpu-smoke-test.yml'

jobs:
  gpu-smoke-test:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10

    steps:
      - name: Show runner identity
        run: |
          echo "Hostname: $(hostname)"
          echo "User: $(whoami)"
          echo "Working directory: $(pwd)"
          echo "Kernel: $(uname -a)"

      - name: Check NVIDIA GPU
        run: |
          nvidia-smi

      - name: Check Python
        run: |
          python3 --version
          which python3

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify repository checkout
        run: |
          echo "Repository workspace: $GITHUB_WORKSPACE"
          git status --short --branch
          ls -la
