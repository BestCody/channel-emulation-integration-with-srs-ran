name: Inspect Deployed srsRAN Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-deployed-srsran-image.yml'

jobs:
  inspect:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - name: Inspect exact deployed gNB image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE='ghcr.io/sulaimanalmani/srsranzmq/srsran_zmq:v1.0'

          if docker info >/dev/null 2>&1; then
            DKR='docker'
          elif sudo -n docker info >/dev/null 2>&1; then
            DKR='sudo -n docker'
          else
            echo 'Neither docker nor passwordless sudo docker can access the daemon.' >&2
            ls -l /var/run/docker.sock || true
            id
            exit 1
          fi

          echo "docker_command=$DKR"
          $DKR pull "$IMAGE"

          echo '=== IMAGE ID ==='
          $DKR image inspect "$IMAGE" --format '{{.Id}} {{.Created}}'
          echo '=== HISTORY ==='
          $DKR history --no-trunc "$IMAGE" | head -30 || true

          echo '=== /srsran CONTENTS ==='
          $DKR run --rm --entrypoint /bin/sh "$IMAGE" -lc 'ls -lah /srsran; file /srsran/gnb 2>/dev/null || true; sha256sum /srsran/gnb 2>/dev/null || true'

          echo '=== GNB VERSION ==='
          $DKR run --rm --entrypoint /bin/sh "$IMAGE" -lc '
            if [ -x /srsran/gnb ]; then
              /srsran/gnb --version 2>&1 || true
              /srsran/gnb -v 2>&1 | head -30 || true
              /srsran/gnb --help 2>&1 | head -20 || true
            fi
          '

          echo '=== BINARY VERSION STRINGS ==='
          $DKR run --rm --entrypoint /bin/sh "$IMAGE" -lc '
            if [ -f /srsran/gnb ]; then
              strings /srsran/gnb 2>/dev/null | grep -Ei "(srsran|srsRAN|version|commit|release|23\.|24\.|22\.)" | head -200 || true
            fi
          '

          echo '=== ELF BUILD INFO ==='
          $DKR run --rm --entrypoint /bin/sh "$IMAGE" -lc '
            if [ -f /srsran/gnb ]; then
              readelf -n /srsran/gnb 2>/dev/null | head -100 || true
              readelf -p .comment /srsran/gnb 2>/dev/null | head -80 || true
            fi
          '
