name: Storage Dependency Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/storage-audit.yml'

jobs:
  storage-audit:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Search repository for storage dependencies
        shell: bash
        run: |
          set +e
          echo '=== longhorn references ==='
          grep -RIn --exclude-dir=.git --exclude='storage-audit.yml' 'longhorn' . || true
          echo '=== storageClass references ==='
          grep -RIn --exclude-dir=.git -E 'storageClass(Name)?|persistentVolumeClaim|volumeClaimTemplates|PersistentVolumeClaim' . || true
          echo '=== hostPath/local/emptyDir volume references ==='
          grep -RIn --exclude-dir=.git -E 'hostPath:|local:|emptyDir:' srsran_open5gs 2>/dev/null || true

      - name: Inspect live storage resources
        shell: bash
        run: |
          set +e
          echo '=== storage classes ==='
          kubectl get storageclass -o wide || true
          echo '=== persistent volumes ==='
          kubectl get pv -o wide || true
          echo '=== persistent volume claims, all namespaces ==='
          kubectl get pvc -A -o wide || true

      - name: Inspect Open5GS and srsRAN workload volumes
        shell: bash
        run: |
          set +e
          echo '=== Open5GS PVC references ==='
          kubectl get pods -n open5gs -o jsonpath='{range .items[*]}{"POD "}{.metadata.name}{"\n"}{range .spec.volumes[*]}{"  volume="}{.name}{" pvc="}{.persistentVolumeClaim.claimName}{" hostPath="}{.hostPath.path}{" emptyDir="}{.emptyDir}{" configMap="}{.configMap.name}{" secret="}{.secret.secretName}{"\n"}{end}{end}' || true
          echo
          echo '=== StatefulSets ==='
          kubectl get statefulset -n open5gs -o yaml | grep -nE 'name:|storageClassName:|claimName:|hostPath:|emptyDir:|volumeClaimTemplates:' || true
          echo '=== Deployments ==='
          kubectl get deployment -n open5gs -o yaml | grep -nE 'name:|storageClassName:|claimName:|hostPath:|emptyDir:' || true

      - name: Check whether running pods depend on PVCs
        shell: bash
        run: |
          set -e
          CLAIM_COUNT=$(kubectl get pods -n open5gs -o jsonpath='{range .items[*].spec.volumes[*]}{.persistentVolumeClaim.claimName}{"\n"}{end}' | sed '/^$/d' | sort -u | wc -l)
          echo "Unique PVC claims referenced by currently running open5gs pods: $CLAIM_COUNT"
          if [ "$CLAIM_COUNT" -eq 0 ]; then
            echo 'LIVE_PODS_REQUIRE_PVC=false'
          else
            echo 'LIVE_PODS_REQUIRE_PVC=true'
            kubectl get pods -n open5gs -o jsonpath='{range .items[*]}{.metadata.name}{": "}{range .spec.volumes[*]}{.persistentVolumeClaim.claimName}{" "}{end}{"\n"}{end}'
          fi
