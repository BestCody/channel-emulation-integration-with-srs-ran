name: Temporal Memory Compression Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temporal-compression-smoke.yml'

jobs:
  temporal-compression-smoke:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    steps:
      - name: Install compression experiment code
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$HOME/sionna-srsran"
          NRX="$ROOT/neural_rx"
          STUDY="$ROOT/temporal_reuse"
          PY="$HOME/miniforge3/envs/neural_rx/bin/python"
          OUT="$STUDY/ue_memory/compression_smoke_${GITHUB_RUN_ID}"

          mkdir -p "$STUDY" "$OUT"
          git -C "$NRX" fetch origin experiment/temporal-ue-memory-training

          for f in \
            temporal_training_data.py \
            ue_memory_manager.py \
            temporal_compression.py \
            train_temporal_ue_memory_v3.py \
            test_temporal_compression.py
          do
            git -C "$NRX" show \
              "origin/experiment/temporal-ue-memory-training:scripts/$f" \
              > "$STUDY/$f"
          done

          "$PY" -m py_compile \
            "$STUDY/temporal_training_data.py" \
            "$STUDY/ue_memory_manager.py" \
            "$STUDY/temporal_compression.py" \
            "$STUDY/train_temporal_ue_memory_v3.py" \
            "$STUDY/test_temporal_compression.py"

          echo "OUT=$OUT" >> "$GITHUB_ENV"
          echo "PY=$PY" >> "$GITHUB_ENV"
          echo "NRX=$NRX" >> "$GITHUB_ENV"
          echo "STUDY=$STUDY" >> "$GITHUB_ENV"
          echo "host=$(hostname)"
          nvidia-smi

      - name: Unit test all compression backends
        shell: bash
        run: |
          set -euo pipefail
          cd "$STUDY"
          "$PY" "$STUDY/test_temporal_compression.py" \
            2>&1 | tee "$OUT/compression_unit.log"
          grep -q '"passed": true' "$OUT/compression_unit.log"

      - name: Smoke train writer PCA and autoencoder paths
        shell: bash
        run: |
          set -euo pipefail
          cd "$NRX/scripts"

          for MODE in writer pca autoencoder; do
            MODE_OUT="$OUT/$MODE"
            mkdir -p "$MODE_OUT"
            echo "=== compression=$MODE ==="

            "$PY" "$STUDY/train_temporal_ue_memory_v3.py" \
              --gpu 0 \
              --compression "$MODE" \
              --d-mem 8 \
              --num-it 2 \
              --train-steps 2 \
              --memory-only-steps 1 \
              --batch-size 2 \
              --seq-len 3 \
              --ue-pool-size 4 \
              --memory-expiry-slots 3 \
              --schedule-switch-prob 1.0 \
              --schedule-reorder-prob 1.0 \
              --min-ebno-db 2.5 \
              --max-ebno-db 3.5 \
              --pca-fit-batches 2 \
              --pca-fit-batch-size 2 \
              --ae-reconstruction-weight 0.1 \
              --log-every 1 \
              --seed 20260816 \
              --output-dir "$MODE_OUT" \
              2>&1 | tee "$MODE_OUT/smoke.log"

            test -f "$MODE_OUT/training_summary.json"
            "$PY" - "$MODE" "$MODE_OUT/training_summary.json" <<'PY'
          import json
          import sys

          mode, path = sys.argv[1:]
          x = json.load(open(path))
          assert x["architecture"] == "ue_identity_aware_temporal_memory_v3_compression"
          assert x["compression"] == mode
          assert x["d_mem"] == 8
          assert x["memory_cap_bits_per_ue"] == 256
          assert x["memory_cap_bytes_per_ue"] == 32
          assert x["dynamic_scheduling"] is True
          assert x["identity_routing_check"]["passed"] is True
          assert x["temporal_compression_gradient_check"]["passed"] is True
          assert any(row["schedule_change_fraction"] > 0.0 for row in x["history"])
          if mode == "pca":
              assert x["pca_fit"] is not None
              assert x["pca_fit"]["frozen_after_fit"] is True
              assert 0.0 < x["pca_fit"]["retained_variance_ratio"] <= 1.0
          else:
              assert x["pca_fit"] is None
          if mode == "autoencoder":
              assert any(row["compression_aux_loss"] > 0.0 for row in x["history"])
          print("MODE_SUMMARY_CHECK_PASSED", mode)
          PY
          done

      - name: Upload compression smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temporal-compression-smoke-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: warn
          retention-days: 30
