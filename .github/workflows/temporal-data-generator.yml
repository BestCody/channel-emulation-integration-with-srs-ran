name: Temporal Data Generator

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temporal-data-generator.yml'

jobs:
  inspect-and-validate-temporal-data:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - name: Inspect existing temporal pipeline
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$HOME/sionna-srsran"
          NRX="$ROOT/neural_rx"
          STUDY="$ROOT/temporal_reuse"
          PY="$HOME/miniforge3/envs/neural_rx/bin/python"

          echo "host=$(hostname)"
          echo "root=$ROOT"
          echo "python=$PY"
          "$PY" --version

          test -f "$STUDY/temporal_pipeline.py"
          echo '--- temporal_pipeline.py ---'
          sed -n '1,320p' "$STUDY/temporal_pipeline.py"
          echo '--- end temporal_pipeline.py ---'

          echo '--- relevant Sionna/TF versions ---'
          "$PY" - <<'PY'
          import tensorflow as tf
          import sionna
          print('tensorflow', tf.__version__)
          print('sionna', sionna.__version__)
          PY

      - name: Validate adjacent-TB channel correlation
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$HOME/sionna-srsran"
          NRX="$ROOT/neural_rx"
          STUDY="$ROOT/temporal_reuse"
          PY="$HOME/miniforge3/envs/neural_rx/bin/python"

          cd "$NRX/scripts"
          "$PY" - <<'PY'
          import json
          import sys
          from pathlib import Path
          import numpy as np
          import tensorflow as tf

          study = Path.home() / 'sionna-srsran' / 'temporal_reuse'
          sys.path.insert(0, str(study))
          sys.path.insert(0, '..')

          from temporal_pipeline import TemporalSequence, CONFIG, NUM_TX
          from utils import Parameters, E2E_Model

          p = Parameters(CONFIG, training=False, num_tx_eval=NUM_TX, system='nrx')
          e2e = E2E_Model(p, training=False, mcs_arr_eval_idx=0)
          e2e(1, 1.0)
          seq = TemporalSequence(p, e2e)

          h_seq = seq.sample_sequence_channel(batch_size=16, seq_len=8)
          h = tf.stack(h_seq, axis=1).numpy()  # [B,T,...]

          def corr(a, b):
              a = a.reshape(a.shape[0], -1)
              b = b.reshape(b.shape[0], -1)
              num = np.abs(np.sum(np.conj(a) * b, axis=1))
              den = np.sqrt(np.sum(np.abs(a)**2, axis=1) * np.sum(np.abs(b)**2, axis=1))
              return float(np.mean(num / np.maximum(den, 1e-12)))

          adjacent = [corr(h[:, t], h[:, t+1]) for t in range(h.shape[1]-1)]
          lag2 = [corr(h[:, t], h[:, t+2]) for t in range(h.shape[1]-2)]
          first_last = corr(h[:, 0], h[:, -1])
          summary = {
              'shape': list(h.shape),
              'adjacent_corr_mean': float(np.mean(adjacent)),
              'adjacent_corr': adjacent,
              'lag2_corr_mean': float(np.mean(lag2)),
              'first_last_corr': first_last,
          }
          print('TEMPORAL_CORRELATION_SUMMARY=' + json.dumps(summary, indent=2))
          PY
