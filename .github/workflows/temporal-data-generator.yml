name: Temporal Data Generator

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temporal-data-generator.yml'

jobs:
  install-and-validate-temporal-data:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    steps:
      - name: Install generator on atlas GPU host
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$HOME/sionna-srsran"
          NRX="$ROOT/neural_rx"
          STUDY="$ROOT/temporal_reuse"
          PY="$HOME/miniforge3/envs/neural_rx/bin/python"
          OUT="$STUDY/data_generator_validation/run_${GITHUB_RUN_ID}"

          mkdir -p "$STUDY" "$OUT"
          git -C "$NRX" fetch origin experiment/temporal-data-generator
          git -C "$NRX" show \
            origin/experiment/temporal-data-generator:scripts/temporal_training_data.py \
            > "$STUDY/temporal_training_data.py"

          "$PY" -m py_compile "$STUDY/temporal_training_data.py"
          echo "Installed: $STUDY/temporal_training_data.py"
          sha256sum "$STUDY/temporal_training_data.py"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          echo "PY=$PY" >> "$GITHUB_ENV"
          echo "NRX=$NRX" >> "$GITHUB_ENV"
          echo "STUDY=$STUDY" >> "$GITHUB_ENV"

      - name: Generate and validate correlated TB batch
        shell: bash
        run: |
          set -euo pipefail
          cd "$NRX/scripts"
          "$PY" "$STUDY/temporal_training_data.py" \
            --validate \
            --batch-size 16 \
            --seq-len 8 \
            --ebno-db 3.0 \
            --seed 20260816 \
            --output-json "$OUT/validation.json" \
            | tee "$OUT/validation.log"

          echo '--- validation summary ---'
          cat "$OUT/validation.json"

      - name: Upload validation result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temporal-data-generator-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: warn
          retention-days: 30
