name: Temporal Edge Memory Experiment

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temporal-edge-memory-experiment.yml'

jobs:
  temporal-edge-memory:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 360
    steps:
      - name: Inspect receiver patch and call path
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$HOME/sionna-srsran"
          NRX="$ROOT/neural_rx"
          echo "--- local neural_rx diff ---"
          git -C "$NRX" diff -- utils/neural_rx.py || true
          echo "--- NeuralPUSCHReceiver locations ---"
          grep -n "class NeuralPUSCHReceiver\|def call\|_neural_rx" "$NRX/utils/neural_rx.py" | tail -n 80
          echo "--- receiver wrapper region ---"
          LINE=$(grep -n "class NeuralPUSCHReceiver" "$NRX/utils/neural_rx.py" | head -1 | cut -d: -f1)
          START=$((LINE-20)); END=$((LINE+500)); sed -n "${START},${END}p" "$NRX/utils/neural_rx.py"
          echo "--- E2E receiver construction ---"
          grep -n "NeuralPUSCHReceiver\|CGNNOFDM\|receiver" "$NRX/utils/e2e_model.py" | head -n 120
