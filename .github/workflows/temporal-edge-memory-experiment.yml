name: Temporal Edge Memory Experiment

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temporal-edge-memory-experiment.yml'

jobs:
  temporal-edge-memory:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 360
    steps:
      - name: Inspect temporal NRX experiment interface
        shell: bash
        run: |
          set -euo pipefail
          PY="$HOME/miniforge3/envs/neural_rx/bin/python"
          ROOT="$HOME/sionna-srsran"
          test -x "$PY"
          test -f "$ROOT/temporal_reuse/temporal_pipeline.py"
          echo "HOST=$(hostname)"
          "$PY" --version
          "$PY" -c "import tensorflow as tf, sionna, numpy as np; print('tensorflow',tf.__version__); print('sionna',getattr(sionna,'__version__','unknown')); print('numpy',np.__version__); print('GPUs',tf.config.list_physical_devices('GPU'))"
          echo "--- parent git state ---"
          git -C "$ROOT" status --short --branch || true
          echo "--- temporal pipeline ---"
          sed -n '1,700p' "$ROOT/temporal_reuse/temporal_pipeline.py"
          echo "--- staleness diagnostic ---"
          sed -n '1,500p' "$ROOT/temporal_reuse/diagnose_staleness.py"
          echo "--- temporal README ---"
          cat "$ROOT/temporal_reuse/README.md"
          echo "--- prior merged results ---"
          cat "$ROOT/temporal_reuse/results_merged.json"
