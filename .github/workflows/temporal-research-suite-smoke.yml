name: Temporal Research Suite Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporal-research-suite-smoke.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    steps:
      - name: Checkout integration repo
        uses: actions/checkout@v4

      - name: Checkout temporal neural_rx branch
        uses: actions/checkout@v4
        with:
          repository: BestCody/neural_rx
          ref: experiment/temporal-ue-memory-training
          path: neural_rx_suite_smoke
          fetch-depth: 1
          lfs: true
          submodules: recursive

      - name: Verify Python and compile suite
        shell: bash
        run: |
          set -euo pipefail
          PY="$HOME/miniforge3/envs/neural_rx/bin/python"
          NRX="$GITHUB_WORKSPACE/neural_rx_suite_smoke"
          OUT="$HOME/sionna-srsran/temporal_reuse/research_suite_smoke_${GITHUB_RUN_ID}"
          mkdir -p "$OUT"
          "$PY" - <<'PY'
          import tensorflow as tf
          import sionna
          print('tensorflow', tf.__version__)
          print('gpus', tf.config.list_physical_devices('GPU'))
          PY
          "$PY" -m py_compile \
            "$NRX/scripts/temporal_full_state.py" \
            "$NRX/scripts/train_temporal_full_state.py" \
            "$NRX/scripts/evaluate_temporal_full_state.py" \
            "$NRX/scripts/evaluate_temporal_ue_memory_v2.py" \
            "$NRX/scripts/run_temporal_research_suite.py"
          echo "PY=$PY" >> "$GITHUB_ENV"
          echo "NRX=$NRX" >> "$GITHUB_ENV"
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: Train tiny compressed checkpoint
        working-directory: neural_rx_suite_smoke/scripts
        shell: bash
        run: |
          set -euo pipefail
          "$PY" train_temporal_ue_memory_v4.py \
            --pooling mean --compression writer --d-mem 8 --num-it 2 \
            --train-steps 2 --memory-only-steps 1 --batch-size 1 --seq-len 2 \
            --ue-pool-size 2 --fixed-scheduling --seed 20260816 \
            --output-dir "$OUT/compressed" --log-every 1 \
            2>&1 | tee "$OUT/compressed_train.log"
          test -f "$OUT/compressed/ue_memory_mean_writer_idaware_d8_k2.weights.h5"

      - name: Verify compressed evaluator uses 132 PRBs
        working-directory: neural_rx_suite_smoke/scripts
        shell: bash
        run: |
          set -euo pipefail
          "$PY" evaluate_temporal_ue_memory_v2.py \
            --checkpoint "$OUT/compressed/ue_memory_mean_writer_idaware_d8_k2.weights.h5" \
            --compression writer --pooling mean --d-mem 8 --seq-len 2 --batch-size 1 \
            --snr-min 3.0 --snr-max 3.0 --snr-step 0.25 --target-errors 1 --max-batches 1 \
            --ue-pool-size 2 --seed 20260816 --output-dir "$OUT/compressed_eval" \
            2>&1 | tee "$OUT/compressed_eval.log"
          "$PY" - "$OUT/compressed_eval/evaluation.json" <<'PY'
          import json, sys
          x=json.load(open(sys.argv[1]))
          assert x['parameter_mode']=='training=False'
          assert x['n_size_bwp']==132
          assert x['experiment']=='temporal_ue_memory_132prb_evaluation_v2'
          print('COMPRESSED_132PRB_SMOKE_PASSED')
          PY

      - name: Train tiny raw full-state checkpoint
        working-directory: neural_rx_suite_smoke/scripts
        shell: bash
        run: |
          set -euo pipefail
          "$PY" train_temporal_full_state.py \
            --train-steps 2 --memory-only-steps 1 --batch-size 1 --seq-len 2 \
            --ue-pool-size 2 --fixed-scheduling --seed 20260816 \
            --output-dir "$OUT/full_state" --log-every 1 \
            2>&1 | tee "$OUT/full_state_train.log"
          test -f "$OUT/full_state/ue_memory_full_state_raw_k2.weights.h5"

      - name: Verify full-state evaluator uses 132 PRBs
        working-directory: neural_rx_suite_smoke/scripts
        shell: bash
        run: |
          set -euo pipefail
          "$PY" evaluate_temporal_full_state.py \
            --checkpoint "$OUT/full_state/ue_memory_full_state_raw_k2.weights.h5" \
            --seq-len 2 --batch-size 1 --snr-min 3.0 --snr-max 3.0 --snr-step 0.25 \
            --target-errors 1 --max-batches 1 --ue-pool-size 2 --seed 20260816 \
            --output-dir "$OUT/full_state_eval" \
            2>&1 | tee "$OUT/full_state_eval.log"
          "$PY" - "$OUT/full_state_eval/evaluation.json" <<'PY'
          import json, sys
          x=json.load(open(sys.argv[1]))
          assert x['parameter_mode']=='training=False'
          assert x['n_size_bwp']==132
          assert x['experiment']=='temporal_raw_full_state_132prb_evaluation_v1'
          assert x['memory_floats_per_ue'] > 56
          print('FULL_STATE_132PRB_SMOKE_PASSED')
          PY

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temporal-research-suite-smoke-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: warn
          retention-days: 30
