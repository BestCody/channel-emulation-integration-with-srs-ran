name: Temporal Static Audit Once

on:
  push:
    paths:
      - '.github/workflows/temporal-static-audit-once.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout temporal neural_rx branch
        uses: actions/checkout@v4
        with:
          repository: BestCody/neural_rx
          ref: experiment/temporal-ue-memory-training
          path: neural_rx_audit
          fetch-depth: 1
          lfs: false
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Compile all Python sources
        shell: bash
        run: |
          set -euo pipefail
          cd neural_rx_audit
          python -m compileall -q scripts utils

      - name: Install audit dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'tensorflow-cpu==2.15.1' ruff

      - name: Check temporal code for undefined names
        shell: bash
        run: |
          set -euo pipefail
          cd neural_rx_audit
          ruff check \
            scripts/temporal_*.py \
            scripts/*ue_memory*.py \
            scripts/crnti_memory_adapter.py \
            scripts/run_temporal_research_suite*.py \
            --select E9,F63,F7,F82

      - name: Run CPU-safe temporal unit tests
        shell: bash
        env:
          CUDA_VISIBLE_DEVICES: '-1'
          TF_CPP_MIN_LOG_LEVEL: '2'
        run: |
          set -euo pipefail
          cd neural_rx_audit/scripts
          python test_temporal_eval_metrics.py
          python test_temporal_pooling.py
          python test_temporal_compression.py
          python test_ue_memory_manager.py
          python test_crnti_memory_adapter.py
          python test_temporal_nrx_runtime.py
