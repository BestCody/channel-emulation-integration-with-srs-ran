name: Temporal UE Memory Training Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temporal-ue-memory-smoke.yml'

jobs:
  temporal-ue-memory-smoke:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    steps:
      - name: Install UE-aware temporal training and runtime code
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$HOME/sionna-srsran"
          NRX="$ROOT/neural_rx"
          STUDY="$ROOT/temporal_reuse"
          PY="$HOME/miniforge3/envs/neural_rx/bin/python"
          OUT="$STUDY/ue_memory/smoke_${GITHUB_RUN_ID}"

          mkdir -p "$STUDY" "$OUT"
          git -C "$NRX" fetch origin experiment/temporal-ue-memory-training

          for f in \
            temporal_training_data.py \
            ue_memory_manager.py \
            crnti_memory_adapter.py \
            temporal_nrx_runtime.py \
            train_temporal_ue_memory.py \
            test_ue_memory_manager.py \
            test_crnti_memory_adapter.py \
            test_temporal_nrx_runtime.py
          do
            git -C "$NRX" show \
              "origin/experiment/temporal-ue-memory-training:scripts/$f" \
              > "$STUDY/$f"
          done

          "$PY" -m py_compile \
            "$STUDY/temporal_training_data.py" \
            "$STUDY/ue_memory_manager.py" \
            "$STUDY/crnti_memory_adapter.py" \
            "$STUDY/temporal_nrx_runtime.py" \
            "$STUDY/train_temporal_ue_memory.py" \
            "$STUDY/test_ue_memory_manager.py" \
            "$STUDY/test_crnti_memory_adapter.py" \
            "$STUDY/test_temporal_nrx_runtime.py"

          echo "OUT=$OUT" >> "$GITHUB_ENV"
          echo "PY=$PY" >> "$GITHUB_ENV"
          echo "NRX=$NRX" >> "$GITHUB_ENV"
          echo "STUDY=$STUDY" >> "$GITHUB_ENV"
          echo "host=$(hostname)"
          nvidia-smi

      - name: Test UE identity memory manager
        shell: bash
        run: |
          set -euo pipefail
          cd "$STUDY"
          "$PY" "$STUDY/test_ue_memory_manager.py" \
            2>&1 | tee "$OUT/ue_memory_manager_test.log"
          grep -q '"passed": true' "$OUT/ue_memory_manager_test.log"

      - name: Test C-RNTI memory adapter
        shell: bash
        run: |
          set -euo pipefail
          cd "$STUDY"
          "$PY" "$STUDY/test_crnti_memory_adapter.py" \
            2>&1 | tee "$OUT/crnti_memory_adapter_test.log"
          grep -q '"passed": true' "$OUT/crnti_memory_adapter_test.log"

      - name: Test live temporal NRX runtime transaction
        shell: bash
        run: |
          set -euo pipefail
          cd "$STUDY"
          "$PY" "$STUDY/test_temporal_nrx_runtime.py" \
            2>&1 | tee "$OUT/temporal_nrx_runtime_test.log"
          grep -q '"passed": true' "$OUT/temporal_nrx_runtime_test.log"

      - name: Validate dynamic temporal data
        shell: bash
        run: |
          set -euo pipefail
          cd "$NRX/scripts"
          "$PY" "$STUDY/temporal_training_data.py" \
            --gpu 0 \
            --batch-size 4 \
            --seq-len 4 \
            --ebno-db 3.0 \
            --ue-pool-size 4 \
            --dynamic-scheduling \
            --schedule-switch-prob 1.0 \
            --schedule-reorder-prob 1.0 \
            --seed 20260816 \
            --validate \
            --output-json "$OUT/dynamic_data_validation.json" \
            2>&1 | tee "$OUT/dynamic_data_validation.log"
          grep -q 'VALIDATION_PASSED' "$OUT/dynamic_data_validation.log"

      - name: Run UE-aware connected sequence training smoke test
        shell: bash
        run: |
          set -euo pipefail
          cd "$NRX/scripts"
          "$PY" "$STUDY/train_temporal_ue_memory.py" \
            --gpu 0 \
            --d-mem 16 \
            --num-it 2 \
            --train-steps 4 \
            --memory-only-steps 2 \
            --batch-size 2 \
            --seq-len 4 \
            --ue-pool-size 4 \
            --memory-expiry-slots 3 \
            --schedule-switch-prob 1.0 \
            --schedule-reorder-prob 1.0 \
            --min-ebno-db 2.5 \
            --max-ebno-db 3.5 \
            --log-every 1 \
            --seed 20260816 \
            --output-dir "$OUT" \
            2>&1 | tee "$OUT/smoke.log"

          test -f "$OUT/training_summary.json"
          "$PY" - "$OUT/training_summary.json" <<'PY'
          import json
          import sys
          p = sys.argv[1]
          x = json.load(open(p))
          assert x["architecture"] == "ue_identity_aware_temporal_memory_v2"
          assert x["dynamic_scheduling"] is True
          assert x["identity_routing_check"]["passed"] is True
          assert x["temporal_gradient_check"]["passed"] is True
          assert any(
              row["schedule_change_fraction"] > 0.0
              for row in x["history"]
          )
          print("SUMMARY_CHECK_PASSED")
          PY

          echo '--- summary ---'
          cat "$OUT/training_summary.json"

      - name: Upload smoke-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temporal-ue-memory-smoke-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: warn
          retention-days: 30
