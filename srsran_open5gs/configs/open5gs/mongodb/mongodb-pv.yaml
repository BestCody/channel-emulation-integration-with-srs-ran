apiVersion: v1
kind: PersistentVolume
metadata:
  # Keep the existing PV name so current single-node deployments remain
  # compatible. Despite the retained name/class below, this is not a Longhorn
  # volume; it is a statically provisioned hostPath volume on the node.
  name: mongodb-longhorn-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  # Established matching label used by the existing MongoDB StatefulSet/PVC.
  # No Longhorn StorageClass or Longhorn installation is required.
  storageClassName: longhorn
  hostPath:
    path: /var/lib/mongo-pv/datadir-mongodb-0
    type: DirectoryOrCreate
