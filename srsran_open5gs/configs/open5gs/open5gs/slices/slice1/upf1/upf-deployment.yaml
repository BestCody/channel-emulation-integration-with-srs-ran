apiVersion: apps/v1
kind: Deployment
metadata:
  name: open5gs-upf1
  labels:
    app: open5gs
    nf: upf
    name: upf1
spec:
  selector:
    matchLabels:
      app: open5gs
      nf: upf
      name: upf1
  replicas: 1
  template:
    metadata:
      labels:
        app: open5gs
        nf: upf
        name: upf1
      annotations:
        k8s.v1.cni.cncf.io/networks: '[
          { "name": "n3network", "interface": "n3", "ips": [ "10.10.3.1/24" ] },
          { "name": "n4network", "interface": "n4", "ips": [ "10.10.4.1/24" ] }
          ]'
    spec:
      initContainers:
      - name: wait-smf
        image: busybox:1.32.0
        env:
        - name: DEPENDENCIES
          value: smf1-nsmf:80
        command: ["sh", "-c", "until nc -z $DEPENDENCIES; do echo waiting for the SMF; sleep 2; done;"]
      containers:
      - name: upf
        image: ghcr.io/niloysh/open5gs:v2.7.0
        imagePullPolicy: Always
        command: [ "/open5gs/config/wrapper.sh" ]
        volumeMounts:
        - mountPath: /open5gs/config/
          name: upf-volume
        ports:
        - containerPort: 8805
          name: n4
          protocol: UDP
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        securityContext:
          privileged: true
      - name: iperf3
        image: networkstatic/iperf3@sha256:25bce1d02f5e1c0acb4a4376815b87059ad730cd9a1c18ce8a9cb9babd7ad05f
        imagePullPolicy: IfNotPresent
        args: ["-s"]
        ports:
        - containerPort: 5201
          name: iperf3
          protocol: TCP
        resources:
          requests:
            memory: "16Mi"
            cpu: "10m"
          limits:
            memory: "64Mi"
            cpu: "500m"
      volumes:
      - name: upf-volume
        configMap:
          name: upf1-configmap
          items:
          - key: upfcfg.yaml
            path: upfcfg.yaml
          - key: wrapper.sh
            path: wrapper.sh
            mode: 0777
