---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: srsran-gnb
  labels:
    app: srsran
    component: gnb
spec:
  selector:
    matchLabels:
      app: srsran
      component: gnb
  replicas: 1
  template:
    metadata:
      labels:
        app: srsran
        component: gnb
      annotations:
        k8s.v1.cni.cncf.io/networks: '[
          { "name": "n3network", "interface": "n3", "ips": [ "10.10.3.231/24" ] }
          ]'
    spec:
      containers:
        - image: ghcr.io/sulaimanalmani/srsranzmq/srsran_zmq:v1.0
          name: gnb
          resizePolicy:
          - resourceName: cpu
            restartPolicy: NotRequired
          resources:
            requests:
              memory: "3000Mi"
              cpu: "50m"
            limits:
              memory: "3000Mi"
              cpu: "5000m"
          ports:
            - name: gnb-ue
              containerPort: 4997
              protocol: UDP
            - name: metrics
              containerPort: 8000
              protocol: TCP
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          env:
            - name: SRSRAN_AMF_N3_ADDR
              value: "10.10.3.200"
            - name: SRSRAN_GNB_N3_BIND_ADDR
              value: "10.10.3.231"
            - name: SRSRAN_GNB_ZMQ_ADDR
              value: "10.10.3.231"
            - name: SRSRAN_UE_ZMQ_ADDR
              value: "10.10.3.232"
            - name: SRSRAN_ZMQ_INTERFACE
              value: "n3"
          command: ["/srsran/config/wrapper.sh"]
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "rm -rf /mnt/*_log.txt"]
          volumeMounts:
            - mountPath: /srsran/config
              name: gnb-volume
            - mountPath: /var/log/
              name: varlog
            - name: host-mount
              mountPath: /mnt/
        - image: busybox
          name: gnb-logs
          args: [/bin/sh, -c, 'while ! tail -f /var/log/gnb.log 2>/dev/null; do sleep 1 ; done']
          volumeMounts:
            - mountPath: /var/log/
              name: varlog

      dnsPolicy: ClusterFirst
      restartPolicy: Always
      volumes:
        - name: gnb-volume
          configMap:
            name: gnb-configmap
            items:
              - key: srsran-gnb.yaml
                path: srsran-gnb.yaml
              - key: render_gnb_config.py
                path: render_gnb_config.py
                mode: 0755
              - key: wrapper.sh
                path: wrapper.sh
                mode: 0777
              - key: start_gnb.sh
                path: start_gnb.sh
                mode: 0777
        - name: varlog
          emptyDir: {}
        - name: host-mount
          hostPath:
            path: /mnt/
            type: Directory
